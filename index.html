<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dokuz Diyar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Yerleşim: tek sütun oyun konsolu — üstte durum şeridi, ortada piksel sahne, altta dokunmatik tuşlar; menüler tam ekran mürekkep panolar. */
:root{
  color-scheme:dark;
  --ink:#12101c; --panel:#1d1a2e; --panel2:#272340; --line:#4a4370;
  --paper:#ebe2cb; --dim:#a79fc0; --jade:#5fd0a8; --gold:#e8b84a; --blood:#d8566a; --qi:#6aa8f0;
  --display:"Pixelify Sans","VT323",ui-monospace,Menlo,monospace;
  --body:"VT323",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:20px;line-height:1.15;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
*{box-sizing:border-box}
button{font:inherit;color:var(--paper);background:var(--panel2);border:2px solid var(--line);padding:6px 12px;cursor:pointer;border-radius:0;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.35)}
button:hover{border-color:var(--jade)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--jade);color:#0e2a22;border-color:#c8f5e4;font-family:var(--display);font-weight:700}
button.on{border-color:var(--gold);background:#3a3360;color:var(--gold)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}

#app{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#hud{display:grid;grid-template-columns:1fr auto;gap:4px 14px;background:var(--panel);border:2px solid var(--line);padding:6px 10px}
#hud .who{font-family:var(--display);color:var(--gold);min-width:0}
#hud .where{color:var(--dim);text-align:right}
.bars{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bar{position:relative;height:18px;background:#0c0a14;border:2px solid var(--line);font-size:16px;line-height:14px;text-align:center;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:50%;background:var(--blood)}
.bar.qi i{background:var(--qi)} .bar.xp i{background:var(--gold)}
.bar span{position:relative;text-shadow:1px 1px 0 #000;white-space:nowrap}
#stage{position:relative;border:2px solid var(--line);background:#000;line-height:0}
#cv{width:100%;height:auto;display:block;aspect-ratio:320/208}
#toast{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;line-height:1.1}
#toast div{background:rgba(18,16,28,.92);border:2px solid var(--gold);color:var(--gold);padding:3px 10px;max-width:100%}
#dlg{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(24,21,40,.97);border:2px solid var(--paper);padding:10px 12px;line-height:1.15;z-index:15;cursor:pointer}
#dlg .who{font-family:var(--display);color:var(--gold);margin-bottom:2px}
#dlg .txt{white-space:pre-wrap}
#dlg .hint{color:var(--dim);text-align:right;font-size:16px}
.choices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.choices button{text-align:left}
#pad{display:none;justify-content:space-between;align-items:center;gap:10px;user-select:none;-webkit-user-select:none;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:2px}
.dpad button,.acts button{touch-action:none;font-size:22px;padding:0}
.acts{display:grid;grid-template-columns:repeat(2,minmax(76px,1fr));gap:6px}
.acts button{height:52px}
#help{color:var(--dim);font-size:17px;margin:0;text-align:center}
@media (pointer:coarse),(max-width:640px){#pad{display:flex}#help{display:none}}
@media (max-width:640px){
  body{font-size:18px}
  #dlg{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .bars{grid-template-columns:1fr}
}

.screen{position:fixed;inset:0;z-index:20;background:var(--ink);overflow:auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);border:2px solid var(--line);padding:10px 12px}

#title .wrap{align-items:center;text-align:center;gap:14px}
#banner{width:100%;max-width:640px;border:2px solid var(--line);aspect-ratio:320/130}
#title h1{font-size:clamp(40px,11vw,76px);color:var(--gold);letter-spacing:.04em;text-shadow:4px 4px 0 #5a2a30;line-height:.95}
#title .sub{color:var(--jade);font-size:24px;letter-spacing:.12em;text-transform:uppercase}
#title p{max-width:54ch;margin:0;color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.langrow span{color:var(--dim)}

#create h2{color:var(--gold);font-size:30px}
#create h3{color:var(--gold)}
.cgrid{display:grid;grid-template-columns:220px 1fr;gap:12px;align-items:start}
@media (max-width:640px){.cgrid{grid-template-columns:1fr}}
.pv{display:flex;flex-direction:column;align-items:center;gap:8px}
#pvc{width:176px;height:176px;background:#2c5a3c;border:2px solid var(--line)}
.opt{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.opt:last-child{border-bottom:0}
.opt>span{color:var(--dim)}
.opt .vals{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.sw{width:28px;height:28px;padding:0;border:2px solid var(--line)}
.sw.on{border-color:var(--gold);outline:2px solid var(--gold);outline-offset:1px}
#nm{font:inherit;background:#0c0a14;color:var(--paper);border:2px solid var(--line);padding:5px 8px;width:100%;max-width:260px}
.fate{min-height:2.4em;color:var(--dim);margin:6px 0}
.fate b{font-family:var(--display)}

#battle .wrap{gap:10px}
.fighters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fighter{display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;min-width:0}
.fighter canvas{width:min(100%,192px);aspect-ratio:1;background:linear-gradient(#2a2644 60%,#3a4a3a 60%);border:2px solid var(--line)}
.fighter .nm{font-family:var(--display);color:var(--gold)}
.fighter .bar{width:100%}
#blog{min-height:5.4em;white-space:pre-wrap}
#bact{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}

.tabs{display:flex;flex-wrap:wrap;gap:6px}
#mbody{min-height:50vh}
#mbody h3{color:var(--gold);margin:10px 0 4px}
#mbody p{margin:4px 0}
#mbody canvas{width:100%;max-width:640px;height:auto;display:block;border:2px solid var(--line);background:#0c0a14}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.item small{color:var(--dim);font-size:17px;display:block}
.item div{min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.kv span:nth-child(odd){color:var(--dim)}
.legend{color:var(--dim);font-size:17px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<section id="title" class="screen">

       data-en="Dao Calendar, year 9872. The spirit tide is rising; the South Heavenly Gate, uncrossed for seven thousand years, has appeared three times above Kunlun. Fate decides whose disciple you are born as: you may wake in the courtyard of an orthodox sect, or in a blood cave."></p>
    <div class="row"><button class="primary" id="bnew" data-tr="Yeni Oyun" data-en="New Game"></button><button id="bcont" hidden data-tr="Devam Et" data-en="Continue"></button></div>
  </div>
</section>

<section id="create" class="screen" hidden>
  <div class="wrap">
    <h2 data-tr="Müridini Oluştur" data-en="Create Your Disciple"></h2>
    <div class="cgrid">
      <div class="pv box">
        <canvas id="pvc" width="176" height="176"></canvas>
        <div class="row"><button id="turnl" aria-label="Turn left">◀</button><button id="rnd" data-tr="Rastgele" data-en="Random"></button><button id="turnr" aria-label="Turn right">▶</button></div>
      </div>
      <div class="box" id="opts"></div>
    </div>
    <div class="box">
      <h3 data-tr="Ruh Kökü Ölçümü" data-en="Spirit Root Test"></h3>

      <p class="fate" id="rootres"></p>
      <div class="row" style="justify-content:flex-start"><button id="roll"></button></div>
    </div>
    <div class="box">
      <h3 data-tr="Köken (kader belirler)" data-en="Origin (decided by fate)"></h3>
      <p class="fate" id="origres"></p>
      <div class="row" style="justify-content:flex-start"><button id="oroll"></button></div>
    </div>
    <div class="row"><button id="back" data-tr="Geri" data-en="Back"></button><button class="primary" id="start" disabled data-tr="Yola Çık" data-en="Set Out"></button></div>
  </div>
</section>

<section id="battle" class="screen" hidden>
  <div class="wrap">
    <div class="fighters">
      <div class="fighter box"><div class="nm" id="pn"></div><canvas id="pc" width="96" height="96"></canvas>
        <div class="bar"><i id="pbh"></i><span id="pth"></span></div><div class="bar qi"><i id="pbq"></i><span id="ptq"></span></div></div>
      <div class="fighter box"><div class="nm" id="en"></div><canvas id="ec" width="96" height="96"></canvas>
        <div class="bar"><i id="ebh"></i><span id="eth"></span></div><div id="eel"></div></div>
    </div>
    <div class="box" id="blog"></div>
    <div id="bact"></div>
  </div>
</section>

<section id="menu" class="screen" hidden>
  <div class="wrap">
    <div class="tabs" id="mtabs"></div>
    <div class="box" id="mbody"></div>
  </div>
</section>

(()=>{'use strict';

const need=L=>25+L*L*6;
function realm(L){if(L<=10)return T('Qi Arıtma '+L+'. Katman','Qi Refining · Layer '+L);
  if(L<=14)return T('Temel Kurma · ','Foundation · ')+[['Erken','Early'],['Orta','Mid'],['Geç','Late'],['Zirve','Peak']][L-11][LANG]+T(' Evre',' Stage');return T('Altın Çekirdek','Golden Core')}
const isDemon=()=>P.faction==='d';
function stats(){const L=P.L,b=P.root==='bes'?1.2:1;
  return{maxhp:Math.round((40+L*12+(L>10?60:0)+(L>14?150:0))*b),maxqi:20+L*8+(L>10?40:0)+(L>14?80:0),
    atk:6+L*2+P.wpn*3+(L>10?8:0)+(L>14?14:0)-(P.origin==='danxia'?2:0),def:2+L+(P.flags.mirror?3:0)+(L>10?4:0)}}
function techs(){const t=[];
  if(P.L>=2)t.push({n:tx(T1[P.el]),cost:8,pow:1.7,el:P.el});
  if(P.demon>=3)t.push({n:T('Kan Gölgesi Pençesi','Blood Shadow Claw'),cost:10,pow:1.9,el:'water',ls:.5});
  if(P.L>=4)t.push({n:T('Qi Dolaşımı','Qi Circulation'),cost:12,heal:.35});
  if(P.L>=6)t.push({n:T('Kılıç Sürme Sanatı','Flying Sword Art'),cost:16,pow:2.4,el:P.el});
  if(P.demon>=8)t.push({n:T('Ruh Yutan Sancak','Soul-Devouring Banner'),cost:22,pow:3.0,el:null,ls:.3});
  if(P.L>=11)t.push({n:T('Beş Yıldırım Yöntemi','Five Thunders Method'),cost:30,pow:3.4,el:'thunder'});
  return t}
function lookOf(l){return{g:l.g,skin:SKINS[l.skin],hair:HAIRC[l.hair],hs:l.hs,eye:EYEC[l.eye],robe:ROBEC[l.robe],robe2:ROBEC[l.robe2],outfit:l.outfit,build:l.build,acc:l.acc}}
function give(id,n=1){P.inv[id]=(P.inv[id]||0)+n;toast(`+${n} ${tx(ITEMS[id].n)}`)}
function has(id,n=1){return(P.inv[id]||0)>=n}
function take(id,n=1){P.inv[id]=(P.inv[id]||0)-n;if(P.inv[id]<=0)delete P.inv[id]}
function stones(n){P.st+=n;toast((n>0?'+':'')+n+T(' ruh taşı',' spirit stones'))}
function addDemon(n){P.demon+=n;toast(T(`Şeytani yol +${n}`,`Demonic path +${n}`));
  if(P.demon>=3&&P.demon-n<3)toast(T('Yeni teknik: Kan Gölgesi Pençesi','New technique: Blood Shadow Claw'));
  if(P.demon>=8&&P.demon-n<8)toast(T('Yeni teknik: Ruh Yutan Sancak','New technique: Soul-Devouring Banner'))}
function addKarma(n){P.karma+=n;toast(n>0?T('Erdem arttı','Virtue increased'):T('Erdem azaldı','Virtue decreased'))}
function demonRank(){const d=P.demon;return d<=0?T('Lekesiz','Untainted'):d<3?T('Gölge düşmüş','Shadowed'):d<6?T('Şeytani eğilim','Demonic leaning'):d<10?T('Şeytani kültivatör','Demonic cultivator'):T('Şeytan efendisi adayı','Demon lord in the making')}
function heal(){const s=stats();P.hp=s.maxhp;P.qi=s.maxqi}
function gainXp(n){
  n=Math.round(n);
  while(n>0){
    const nd=need(P.L);
    if(P.L===10||P.L===14||P.L>=15){P.xp=Math.min(nd,P.xp+n);
      if(P.xp>=nd&&P.L<15&&!P.capMsg){P.capMsg=1;toast(P.L===10?T('Darboğaz! Temel Kurma için meditasyona otur.','Bottleneck! Meditate to attempt Foundation.'):T('Darboğaz! Gök felaketi için meditasyona otur.','Bottleneck! Meditate to face the tribulation.'))}
      break}
    const room=nd-P.xp;
    if(n>=room){n-=room;P.xp=0;P.L++;P.capMsg=0;heal();toast(T('Atılım! ','Breakthrough! ')+realm(P.L));
      const nt={2:tx(T1[P.el]),4:T('Qi Dolaşımı','Qi Circulation'),6:T('Kılıç Sürme Sanatı','Flying Sword Art')}[P.L];if(nt)toast(T('Yeni teknik: ','New technique: ')+nt)}
    else{P.xp+=n;n=0}
  }
  hud()}

function drawChar(c,ox,oy,L,dir,fr){
  const p=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(ox+x,oy+y,w,h)};
  const c1=L.robe,c2=L.robe2||'#c8a040',of=L.outfit||0,dk=shade(c1,-.28),hair=L.hair,shoe='#241c2a',bald=L.hs===5,gold='#e8b84a';
  const bw=L.build===0?6:L.build===2?10:8,bx=8-bw/2,flare=L.g===1||of===2;
  p(4,15,8,1,'rgba(0,0,0,.28)');
  if(L.hs===1&&dir!==3){if(dir===0){p(3,6,1,6,hair);p(12,6,1,6,hair)}else if(dir===1)p(10,7,3,5,hair);else p(3,7,3,5,hair)}
  if(L.hs===3&&dir===0){p(12,1,2,2,hair);p(13,3,1,6,hair)}
  if(L.hs===7&&dir!==3)p(dir===2?3:12,6,1,7,hair);
  if(of===3&&dir!==3)p(bx-2,8,bw+4,6,shade(c2,-.25));
  if(fr!==2)p(5,14,2,1,shoe);if(fr!==1)p(9,14,2,1,shoe);
  if(of===1||of===4){p(bx,8,bw,4,c1);p(bx,12,bw,2,c2);p(7,12,2,2,shade(c2,-.4))}
  else{p(bx,8,bw,6,c1);if(flare)p(bx-1,12,bw+2,2,c1);p(bx,13,bw,1,dk);if(flare)p(bx-1,13,bw+2,1,dk)}
  if(L.g===0&&of!==4)p(bx-1,8,bw+2,2,c1);
  if(of===5&&dir!==3)p(7,8,2,6,c2);
  p(bx,10,bw,1,c2);
  const slv=of===4?L.skin:dk;
  if(dir===0||dir===3){
    if(of===2){p(bx-2,8,2,5,c1);p(bx+bw,8,2,5,c1);p(bx-2,12,2,1,c2);p(bx+bw,12,2,1,c2)}
    else{p(bx-1,8,1,4,slv);p(bx+bw,8,1,4,slv);if(of===1){p(bx-1,11,1,1,c2);p(bx+bw,11,1,1,c2)}if(dir===0){p(bx-1,12,1,1,L.skin);p(bx+bw,12,1,1,L.skin)}}
    if(dir===0){
      if(of===2){p(6,8,4,1,c2);p(7,9,2,1,c2)}else if(of===4)p(7,8,2,1,L.skin);else if(of!==5)p(7,8,2,2,dk);
      if(of===3){p(bx-1,8,bw+2,1,c2);p(bx-2,8,1,6,c2);p(bx+bw+1,8,1,6,c2);p(7,8,2,1,gold)}}
    else if(of===3)p(bx-1,8,bw+2,6,c2);
  }else{
    if(of===2){p(6,9,4,3,c1);p(6,12,4,1,c2)}else{p(7,9,2,3,slv);p(7,12,2,1,L.skin)}
    if(of===3)p(dir===1?bx+bw-2:bx-1,8,3,6,c2)}
  p(4,2,8,6,L.skin);
  if(dir===0){if(!bald){p(4,1,8,2,hair);p(3,2,1,4,hair);p(12,2,1,4,hair);p(4,3,2,1,hair);p(10,3,2,1,hair)}
    p(6,5,1,1,L.eye);p(9,5,1,1,L.eye);if(L.g===1){p(5,6,1,1,'#e89a9a');p(10,6,1,1,'#e89a9a')}}
  else if(dir===3){if(!bald){p(4,1,8,6,hair);p(3,2,1,4,hair);p(12,2,1,4,hair)}}
  else if(dir===1){if(!bald){p(4,1,8,2,hair);p(8,3,4,4,hair);p(12,2,1,4,hair)}p(5,5,1,1,L.eye)}
  else{if(!bald){p(4,1,8,2,hair);p(4,3,4,4,hair);p(3,2,1,4,hair)}p(10,5,1,1,L.eye)}
  if(L.hs===1&&dir===3)p(4,7,8,5,hair);
  if(L.hs===2){p(6,-1,4,2,hair);p(5,0,1,1,'#5fd0a8');p(10,0,1,1,'#5fd0a8')}
  if(L.hs===3){if(dir===3){p(7,0,2,1,hair);p(7,7,2,6,hair)}else if(dir===1){p(12,2,2,2,hair);p(13,4,1,5,hair)}else if(dir===2){p(2,2,2,2,hair);p(2,4,1,5,hair)}}
  if(L.hs===4){p(3,0,3,2,hair);p(10,0,3,2,hair)}
  if(L.hs===6){p(4,0,1,1,hair);p(6,0,2,1,hair);p(9,0,1,1,hair);p(11,0,1,1,hair);p(3,1,1,1,hair);p(12,1,1,1,hair)}
  if(L.hs===7&&dir===3){p(7,7,2,7,hair);p(7,12,2,1,c2)}
  const a=L.acc;
  if(a===1)p(7,1,2,1,'#5fd0a8');
  if(a===2){p(4,3,8,1,'#c03a3a');if(dir===3)p(11,4,1,3,'#c03a3a')}
  if(a===3&&dir===0)p(7,3,2,1,'#e0304a');
  if(a===4){if(dir===0){p(8,4,3,2,'#16141c');p(4,3,4,1,'#16141c')}else if(dir===2)p(9,4,3,2,'#16141c');else if(dir===3)p(4,3,8,1,'#16141c')}
  if(a===5){const v='#eeeaf4';if(dir===0)p(4,6,8,2,v);else if(dir===1)p(4,6,5,2,v);else if(dir===2)p(7,6,5,2,v)}
  if(a===6){const s='#d8b868';p(6,-1,4,1,s);p(4,0,8,1,s);p(2,1,12,1,s);p(3,2,10,1,'#a8884a')}
  if(a===7){const h='#8a1a2a';p(4,0,1,2,h);p(3,-1,1,1,h);p(11,0,1,2,h);p(12,-1,1,1,h)}
  if(a===8){const fxp=dir===1?4:10;p(fxp,1,2,2,'#f080a0');p(fxp+(dir===1?0:1),2,1,1,'#ffe060')}
  if(a===9){if(dir===0){p(3,6,1,2,gold);p(12,6,1,2,gold)}else if(dir===1)p(9,6,1,2,gold);else if(dir===2)p(6,6,1,2,gold)}
}

function objHidden(o){
  if(o.until&&Date.now()<o.until)return true;
  if(o.id==='kolye'&&!P.flags.kolyeQ)return true;
  if(o.t==='chest'||o.t==='item')return!!P.flags['got_'+o.id];
  if(o.id==='fox')return!!P.flags.fox;
  if(o.id==='boss')return!!P.flags.boss;
  return false}
function objAt(x,y){return cur.objs.find(o=>o.x===x&&o.y===y&&!objHidden(o))}
function walkable(x,y){const m=cur.m;if(y<0||x<0||y>=m.length||x>=m[0].length)return false;if(SOLID.includes(m[y][x]))return false;return!objAt(x,y)}

async function pickAction(E){
  const back={t:T('Geri','Back'),v:null};
  for(;;){
    const main=E.trib?[{t:T('Savun (yarı hasar)','Guard (half damage)'),v:{t:'guard'}},{t:T('Kan Kalkanı (15 Qi, %70 azaltma)','Blood Ward (15 Qi, −70%)'),v:{t:'ward'},off:P.demon<5||P.qi<15},{t:T('Teknik','Technique'),v:'tech'},{t:T('Eşya','Item'),v:'item'}]
      :[{t:T('Saldır','Attack'),v:{t:'atk'}},{t:T('Teknik','Technique'),v:'tech'},{t:T('Eşya','Item'),v:'item'},{t:T('Savun','Guard'),v:{t:'guard'}},{t:T('Kaç','Flee'),v:{t:'flee'},off:E.boss||E.duel}];
    const v=await bButtons(main);
    if(v==='tech'){const ts=techs().filter(t=>!E.trib||t.heal);
      if(!ts.length){blog(E.trib?T('Gök gürültüsüne saldırı tekniği işlemez; yalnızca Qi Dolaşımı.','Attack arts are useless against thunder; only Qi Circulation works.'):T('Henüz teknik bilmiyorsun (2. Katman\'da öğrenilir).','You know no techniques yet (learned at Layer 2).'));continue}
      const r=await bButtons([...ts.map(t=>({t:`${t.n} (${t.cost} Qi)`,v:{t:'tech',k:t},off:P.qi<t.cost})),back]);if(r)return r}
    else if(v==='item'){const ids=['sifahap','qihap','tilsim'].filter(i=>has(i)&&!(E.trib&&i==='tilsim'));
      if(!ids.length){blog(T('Kullanılabilir eşyan yok.','You have no usable items.'));continue}
      const r=await bButtons([...ids.map(i=>({t:`${tx(ITEMS[i].n)} ×${P.inv[i]}`,v:{t:'item',id:i}})),back]);if(r)return r}
    else return v}
}

      :og==='shu'?T('Shu Dağı ile Kunlun arasındaki ittifak gereği, bu yıl Yeşim Boşluk Sarayı\'nda konuk mürit olarak eğitileceksin. Ana salonun önünde ak saçlı bir adam seni bekliyor. (E ile konuş.)','Under the pact between Shu Mountain and Kunlun, you will train this year as a guest disciple of the Jade Void Palace. A white-haired man waits before the main hall. (Press E to talk.)')
      :og==='danxia'?T('Dan Xia Vadisi seni Kunlun\'a gönderdi: "Hap yapmayı öğrendin, şimdi yaşamayı öğren." Ana salonun önünde ak saçlı bir adam seni bekliyor. (E ile konuş.)','Danxia Valley sent you to Kunlun: "You have learned to make pills; now learn to live." A white-haired man waits before the main hall. (Press E to talk.)')
      :T('Bugün Yeşim Boşluk Sarayı\'nın dış kapısındaki ilk günün. Ana salonun önünde ak saçlı bir adam seni bekliyor. (Yanına git ve E ile konuş.)','Today is your first day in the outer court of the Jade Void Palace. A white-haired man waits before the main hall. (Walk up and press E.)'))})};
$('#bcont').onclick=()=>{const s=loadSave();if(s){P=s;startPlay()}};
function startPlay(){P.moving=false;P.med=false;P.flags=P.flags||{};P.inv=P.inv||{};P.seen=P.seen||{};P.demon=P.demon||0;P.faction=P.faction||'o';P.origin=P.origin||'jade';
  const l=P.look;if(l.robe2==null)l.robe2=6;if(l.outfit==null)l.outfit=0;
  scene='play';$('#title').hidden=true;$('#create').hidden=true;$('#hud').hidden=false;cur=MAPS[P.map]||MAPS.sect;P.seen[P.map]=1;hud()}

/* ---------- Döngü ---------- */
let last=0;
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);render();
  if(scene==='create'&&C){const c=$('#pvc').getContext('2d');c.fillStyle='#2c5a3c';c.fillRect(0,0,176,176);c.fillStyle='#3a7048';c.fillRect(0,150,176,26);
    c.save();c.scale(9,9);const f=Math.floor(animT*3)%4;drawChar(c,1.8,2.2,lookOf(C.look),pvDir,[0,1,0,2][f]);c.restore()}
  if(scene==='play'&&mtab==='map'&&!$('#menu').hidden)drawMaps();
  requestAnimationFrame(frame)}
function boot(d){mkTiles();mkMaps();drawBanner();cx.imageSmoothingEnabled=false;applyLang();
  if(d&&d.save){P=d.save;startPlay()}else if(loadSave())$('#bcont').hidden=false;
  requestAnimationFrame(frame)}
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(()=>({save:scene==='play'?P:null}))}catch(e){}
if(hot&&hot.ready)hot.ready(d=>boot(d||{}));else boot((hot&&hot.data)||{});
})();
</script>
